auto__person__ethnicity_concept_id:
  comments:
  - All the values that appear in column ethnicity_concept_id of table person more
    than 7 times
  queries:
    date: '2026-05-22 15:26:05'
    query: "SELECT _counted.value \nFROM (SELECT \"ethnicity_concept_id\" AS value,\
      \ count(\"ethnicity_concept_id\") AS count \nFROM mimic100.person \nWHERE \"\
      ethnicity_concept_id\" IS NOT NULL GROUP BY \"ethnicity_concept_id\") AS _counted\
      \ \nWHERE _counted.count > 7"
  results:
  - value: 0
auto__person__gender_concept_id:
  comments:
  - The values and their counts that appear in column gender_concept_id of a random
    sample of 500 rows of table person
  queries:
    date: '2026-05-22 15:26:05'
    query: "SELECT _counted.value, _counted.count \nFROM (SELECT _inner.value AS value,\
      \ count(_inner.value) AS count \nFROM (SELECT TOP 500 \"gender_concept_id\"\
      \ AS value \nFROM mimic100.person \nWHERE \"gender_concept_id\" IS NOT NULL\
      \ ORDER BY newid()) AS _inner GROUP BY _inner.value) AS _counted ORDER BY _counted.count\
      \ DESC"
  results:
  - count: 57
    value: 8507
  - count: 43
    value: 8532
