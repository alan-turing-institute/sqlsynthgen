---
# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        exclude: docs/(source|build/html)/_static/
      - id: end-of-file-fixer
        exclude: docs/source/_static/
      - id: check-yaml
      - id: check-added-large-files
  - repo: https://github.com/markdownlint/markdownlint
    # Note the "v"
    rev: v0.12.0
    hooks:
      - id: markdownlint
        args: [--style=mdl_style.rb]
  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck
  - repo: local
    hooks:
      # Ensure that the config html pages are current
      - id: config_schema
        name: Config Schema Docs
        entry: >
          poetry run
          generate-schema-doc
          --config-file .jsfh.yaml
          datafaker/json_schemas/config_schema.json
          docs/source/_static/
        language: system
        pass_filenames: false
      - id: black
        name: Black
        entry: poetry run black
        language: system
        types: ['python']
        exclude: (?x)^(
          tests/examples
          )
      - id: isort
        name: isort
        entry: poetry run isort
        language: system
        types: ['python']
        exclude: (?x)^(
          tests/examples|
          examples
          )
      - id: pylint
        name: Pylint
        entry: poetry run pylint
        language: system
        types: ['python']
        exclude: (?x)^(
          examples/
          )
      - id: pydocstyle
        name: pydocstyle
        entry: poetry run pydocstyle
        language: system
        types: ['python']
        exclude: (?x)^(
          docs/|
          tests/|
          examples/
          )
      - id: ty
        name: ty
        entry: poetry run ty check
        language: system
        exclude: (?x)^(
          tests/examples/|
          examples/|
          /\.
          )
        types: ['python']
