row_generators_module: person_row
story_generators_module: person_story

src-stats:
  - name: gender_options
    query: >
      SELECT DISTINCT gender_concept_id as gender_options
      FROM person
  - name: race_options
    query: >
      SELECT DISTINCT race_concept_id as race_options
      FROM person
  - name: ethnicity_options
    query: >
      SELECT DISTINCT ethnicity_concept_id as ethnicity_options
      FROM person
  - name: year_of_birth_stats
    query: >
      SELECT AVG(year_of_birth)::int as mean, STDDEV(year_of_birth)::int as std_dev
      FROM person
  - name: proportion_alive
    query: >
      SELECT 
      CAST(COUNT(*) AS FLOAT) / (SELECT COUNT(*) FROM mimic.person) AS proportion_alive
      FROM person p
      WHERE NOT EXISTS (
        SELECT 1 FROM death d WHERE d.person_id = p.person_id
      )
  - name: age_first_admission
    query: >
      SELECT
        sub.gender_concept_id,
        AVG(sub.age)::int AS average_age_years,
        STDDEV(sub.age)::int AS stddev_age_years
      FROM (
        SELECT
          DISTINCT p.person_id,
          p.gender_concept_id,
          EXTRACT(YEAR FROM MIN(v.visit_start_datetime)) - p.year_of_birth AS age
        FROM person p
        JOIN visit_occurrence v ON p.person_id = v.person_id
        GROUP BY p.person_id, p.gender_concept_id, p.year_of_birth
      ) sub
      GROUP BY sub.gender_concept_id
  - name: age_at_death
    query: >
      SELECT
      AVG(EXTRACT(YEAR FROM AGE(
        d.death_datetime, 
        TO_TIMESTAMP(p.year_of_birth || '-01-01', 'YYYY-MM-DD')
        )))::int AS average_age_years,
      STDDEV(EXTRACT(YEAR FROM AGE(
        d.death_datetime, 
        TO_TIMESTAMP(p.year_of_birth || '-01-01', 'YYYY-MM-DD')
        )))::int AS stddev_age_years
      FROM person p
      INNER JOIN death d ON d.person_id = p.person_id
  - name: visit_duration
    query: >
      SELECT
      AVG(EXTRACT(EPOCH FROM (v.visit_end_datetime - v.visit_start_datetime)) /3600)::int AS average_hours,
      STDDEV(EXTRACT(EPOCH FROM (v.visit_end_datetime - v.visit_start_datetime)) /3600)::int AS stddev_hours
      FROM person p
      JOIN visit_occurrence v ON p.person_id = v.person_id;
  - name: measurement_stats
    query: >
      WITH filtered AS (
        SELECT
          measurement_concept_id,
          visit_occurrence_id,
          value_as_number
        FROM mimic.measurement
        WHERE value_as_number IS NOT NULL
          AND measurement_concept_id <> 0
      ),
      measurement_stats AS (
        SELECT
          measurement_concept_id,
          AVG(value_as_number)::float4 AS measurement_mean,
          STDDEV_SAMP(value_as_number)::float4 AS measurement_stddev
        FROM filtered
        GROUP BY measurement_concept_id
      ),
      visit_counts AS (
        SELECT
          measurement_concept_id,
          visit_occurrence_id,
          COUNT(*) AS measurements_per_visit
        FROM filtered
        WHERE visit_occurrence_id IS NOT NULL
        GROUP BY measurement_concept_id, visit_occurrence_id
      )
      SELECT
        ms.measurement_concept_id,
        ms.measurement_mean,
        ms.measurement_stddev,
        AVG(vc.measurements_per_visit)::float4 AS measurements_per_visit_avg,
        STDDEV_SAMP(vc.measurements_per_visit)::float4 AS measurements_per_visit_std
      FROM measurement_stats ms
      JOIN visit_counts vc USING (measurement_concept_id)
      GROUP BY
        ms.measurement_concept_id,
        ms.measurement_mean,
        ms.measurement_stddev
      ORDER BY ms.measurement_concept_id;
  - name: bp_profile     
    query: >
      SELECT
      gender_concept_id,
      AVG(CASE WHEN (measurement_concept_id = 21492239 AND age > 60) THEN value_as_number END )::int AS average_over_60_systolic,
      AVG(CASE WHEN (measurement_concept_id = 21492239 AND age <= 60) THEN value_as_number END )::int AS average_under_60_systolic,
      STDDEV(CASE WHEN (measurement_concept_id = 21492239 AND age > 60) THEN value_as_number END )::int AS stddev_over_60_systolic,
      STDDEV(CASE WHEN (measurement_concept_id = 21492239 AND age <= 60)  THEN value_as_number END )::int AS stddev_under_60_systolic,
      AVG(CASE WHEN measurement_concept_id = 21492239 THEN value_as_number END )::int -
      AVG(CASE WHEN measurement_concept_id = 21492240 THEN value_as_number END )::int AS average_systolic_diastolic_difference
      FROM (
          SELECT
              p.person_id,
              p.gender_concept_id,
              EXTRACT(YEAR FROM v.visit_start_datetime) - p.year_of_birth AS age,
              m.value_as_number,
              m.measurement_concept_id
          FROM mimic.person p
          JOIN mimic.visit_occurrence v ON p.person_id = v.person_id
          JOIN mimic.measurement m ON p.person_id = m.person_id
          WHERE m.measurement_concept_id IN (21492239, 21492240)
          ) sub
      GROUP BY sub.gender_concept_id;
  - name: unique_measurements_in_visits
    query: >
      WITH measurement_per_visit AS (
          SELECT
              m.visit_occurrence_id,
              COUNT(DISTINCT m.measurement_concept_id) AS measurement_types_count,
              ARRAY_TO_STRING(
                  ARRAY_AGG(DISTINCT m.measurement_concept_id::text ORDER BY m.measurement_concept_id::text),
                  ','
              ) AS measurement_type_ids
          FROM mimic.measurement m
          JOIN mimic.concept mc
              ON mc.concept_id = m.measurement_concept_id
          WHERE m.visit_occurrence_id IS NOT NULL
          AND m.measurement_concept_id <> 0
          GROUP BY m.visit_occurrence_id
      ),
      unique_measurement_sets AS (
          SELECT
              measurement_types_count,
              measurement_type_ids,
              COUNT(*) AS visits,
              ARRAY_AGG(DISTINCT visit_occurrence_id) AS visit_ids
          FROM measurement_per_visit
          GROUP BY measurement_types_count, measurement_type_ids
      ),
      procedures_per_measurement_set AS (
          SELECT
              ums.measurement_types_count,
              ums.measurement_type_ids,
              ums.visits,
              COALESCE(
                  ARRAY_TO_STRING(
                      ARRAY_AGG(DISTINCT p.procedure_concept_id::text ORDER BY p.procedure_concept_id::text),
                      ','
                  ),
                  ''
              ) AS procedure_type_ids
          FROM unique_measurement_sets ums
          CROSS JOIN UNNEST(ums.visit_ids) AS visit_id
          LEFT JOIN mimic.procedure_occurrence p
              ON p.visit_occurrence_id = visit_id
          GROUP BY
              ums.measurement_types_count,
              ums.measurement_type_ids,
              ums.visits
      )
      SELECT
          measurement_type_ids,
          procedure_type_ids,
          visits,
          ROUND(100.0 * visits::numeric / SUM(visits) OVER (), 2)::float AS percent_of_total
      FROM procedures_per_measurement_set
      ORDER BY measurement_types_count DESC, visits DESC;
  - name: bp_sys_relative_change_stats
    #For each patient + visit + BP type, sort measurements in time,
    #compute |xₜ − xₜ₋₁| / xₜ₋₁ for each step,
    #then average those within that visit.
    #Finally, average that visit-level metric across the population.
    query: >
      WITH bp AS (
          SELECT
              p.person_id,
              p.gender_concept_id,
              v.visit_occurrence_id,
              EXTRACT(YEAR FROM v.visit_start_datetime) - p.year_of_birth AS age,
              m.measurement_concept_id,
              m.value_as_number,
              m.measurement_datetime
          FROM mimic.person p
          JOIN mimic.visit_occurrence v
              ON p.person_id = v.person_id
          JOIN mimic.measurement m
              ON m.visit_occurrence_id = v.visit_occurrence_id
          WHERE m.measurement_concept_id IN (21492239)  -- systolic
      ),
      bp_with_lag AS (
          SELECT
              bp.*,
              LAG(value_as_number) OVER (
                  PARTITION BY person_id, visit_occurrence_id, measurement_concept_id
                  ORDER BY measurement_datetime
              ) AS prev_value
          FROM bp
      ),
      visit_level_rel_var AS (
          SELECT
              person_id,
              gender_concept_id,
              age,
              visit_occurrence_id,
              measurement_concept_id,
              -- average relative change within this visit
              AVG( ABS(value_as_number - prev_value)
                   / NULLIF(prev_value, 0) ) AS avg_rel_var
          FROM bp_with_lag
          WHERE prev_value IS NOT NULL          -- skip first measurement in each visit
          GROUP BY
              person_id,
              gender_concept_id,
              age,
              visit_occurrence_id,
              measurement_concept_id
      )
      SELECT
          gender_concept_id,
          AVG(CASE WHEN measurement_concept_id = 21492239 AND age > 60
                   THEN avg_rel_var END)::float4 AS avg_over_60_systolic_rel_var,
          AVG(CASE WHEN measurement_concept_id = 21492239 AND age <= 60
                   THEN avg_rel_var END)::float4  AS avg_under_60_systolic_rel_var,
          STDDEV(CASE WHEN measurement_concept_id = 21492239 AND age > 60
                      THEN avg_rel_var END)::float4  AS stddev_over_60_systolic_rel_var,
          STDDEV(CASE WHEN measurement_concept_id = 21492239 AND age <= 60
                      THEN avg_rel_var END)::float4 AS stddev_under_60_systolic_rel_var
      FROM visit_level_rel_var
      GROUP BY gender_concept_id;
  - name: procedure_stats
    query: >
      WITH filtered AS (
        SELECT
          procedure_concept_id,
          visit_occurrence_id
        FROM mimic.procedure_occurrence
        WHERE procedure_concept_id <> 0
          AND visit_occurrence_id IS NOT NULL
      ),
      visit_counts AS (
        SELECT
          procedure_concept_id,
          visit_occurrence_id,
          COUNT(*) AS procedures_per_visit
        FROM filtered
        GROUP BY procedure_concept_id, visit_occurrence_id
      )
      SELECT
        procedure_concept_id,
        AVG(procedures_per_visit)::float4 AS procedures_per_visit_avg,
        STDDEV_SAMP(procedures_per_visit)::float4 AS procedures_per_visit_std
      FROM visit_counts
      GROUP BY procedure_concept_id
      ORDER BY procedure_concept_id;

tables:
  person:
    num_rows_per_pass: 0
    row_generators:
      - name: person_row.gender_provider
        kwargs:
          query_results: SRC_STATS["gender_options"]
        columns_assigned: gender_concept_id
      - name: person_row.race_provider
        kwargs:
          query_results: SRC_STATS["race_options"]
        columns_assigned: race_concept_id
      - name: person_row.ethnicity_provider
        kwargs:
          query_results: SRC_STATS["ethnicity_options"]
        columns_assigned: ethnicity_concept_id
      - name: generic.null_provider.null
        columns_assigned: year_of_birth
  death:
    num_rows_per_pass: 0
    row_generators:
      - name: generic.null_provider.null
        columns_assigned: death_type_concept_id
      - name: generic.null_provider.null
        columns_assigned: cause_concept_id
      - name: generic.null_provider.null
        columns_assigned: cause_source_value
      - name: generic.null_provider.null
        columns_assigned: cause_source_concept_id
  measurement:
    num_rows_per_pass: 0
    row_generators:
      - name: generic.null_provider.null
        columns_assigned: measurement_time
      - name: generic.null_provider.null
        columns_assigned: value_source_value
      - name: generic.null_provider.null
        columns_assigned: measurement_type_concept_id
      - name: generic.null_provider.null
        columns_assigned: measurement_source_concept_id
      - name: generic.null_provider.null
        columns_assigned: operator_concept_id
      - name: generic.null_provider.null
        columns_assigned: measurement_concept_id
      - name: generic.null_provider.null
        columns_assigned: person_id
      - name: generic.null_provider.null
        columns_assigned: provider_id
      - name: generic.null_provider.null
        columns_assigned: unit_concept_id
      - name: generic.null_provider.null
        columns_assigned: visit_occurrence_id
  visit_occurrence:
    num_rows_per_pass: 0
  
  concept:
    # This one is a vocab, but its too big to handle the usual way
    ignore: true
    # vocabulary_table: true
  concept_ancestor:
    ignore: true
  vocabulary:
    ignore: true
  domain:
    ignore: true
  concept_class:
    ignore: true
  concept_synonym:
    ignore: true
  concept_relationship:
    ignore: true
  drug_strength:
    ignore: true
  relationship:
    ignore: true
  source_to_concept_map:
    ignore: true
  location:
    ignore: true
  care_site:
    ignore: true
  provider:
    ignore: true
  cdm_source:
    ignore: true

story_generators:
  - name: person_story.generate
    kwargs:
      src_stats: [generic, SRC_STATS]
    num_stories_per_pass: 1